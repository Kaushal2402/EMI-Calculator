name: emi_calculator
description: "EMI Calculator — calculate Equated Monthly Instalments for home, car and personal loans, with amortization schedule and interest-vs-principal chart."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# NOTE: SOW §9 pins older package versions (≈2024 era). They do not resolve on the
# installed toolchain (Flutter 3.44.8 / Dart 3.12.2 / AGP 9 / Gradle 9), which requires
# analyzer 8.x and therefore newer riverpod / custom_lint / freezed / google_mobile_ads.
# Versions below are the minimum coherent set that resolves and builds on this SDK.
# APPROVED by client 2026-09-06: keep this modern set (Riverpod 3.x -> use
# NotifierProvider; freezed 3.x -> `abstract class X with _$X`). Do not re-litigate.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Android 12+ dynamic colour, static fallback otherwise (SOW §6.1).
  # Addition beyond SOW §9 — APPROVED by client 2026-09-06.
  # Pinned to 1.9.x: dynamic_color 2.x targets the new `material_ui` split and
  # its `ColorScheme` is not interchangeable with `flutter/material.dart`'s on
  # Flutter 3.44.8. 1.9.x imports `flutter/material.dart` directly.
  dynamic_color: ^1.9.0

  # State management (SOW §9 pins ^2.5.1; toolchain forces 3.x — same @riverpod codegen API)
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation (SOW §9 pins ^14.2.0)
  go_router: ^18.0.1

  # UI / Fonts (SOW §9 pins google_fonts ^6.2.1, fl_chart ^0.68.0)
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0

  # Ads (SOW §9 pins ^5.1.0; toolchain forces 9.x — AGP 9 / Gradle 9 compat)
  google_mobile_ads: ^9.1.0

  # iOS App Tracking Transparency prompt (SOW §4.8 / TASKS 7.1). google_mobile_ads
  # has no ATT API of its own. Addition beyond SOW §9 — APPROVED by client 2026-09-06.
  app_tracking_transparency: ^2.0.7

  # Utilities (SOW §9 pins intl ^0.19.0, share_plus ^9.0.0, shared_preferences ^2.3.0)
  intl: ^0.20.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5

  # Data / Serialisation (SOW §9 pins freezed_annotation ^2.4.4, json_annotation ^4.9.0)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.3.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# TASKS 9.1 — App icon set (D-04). Regenerate after changing the source art:
#   dart run tool/generate_branding.py   # rebuilds assets/branding/*
#   dart run flutter_launcher_icons
# Source art is generated from code (tool/generate_branding.py); palette matches
# SOW §6.1. Master is full-bleed with no alpha (iOS requirement); Android uses a
# separate adaptive foreground/background pair.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/branding/icon_master.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ---------------------------------------------------------------------------
# TASKS 9.2 — Native (OS) splash. Solid brand colour + white mark; the Flutter
# SplashScreen widget (SOW §5.1, gradient + wordmark + progress bar) takes over
# once the engine is up, so the hand-off is seamless. Regenerate:
#   dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#1565C0"
  color_dark: "#0D47A1"
  image: "assets/branding/splash_logo.png"
  image_dark: "assets/branding/splash_logo.png"
  android: true
  ios: true
  web: false
  fullscreen: false
  android_12:
    color: "#1565C0"
    color_dark: "#0D47A1"
    image: "assets/branding/splash_logo.png"
    image_dark: "assets/branding/splash_logo.png"
