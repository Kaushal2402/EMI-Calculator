name: emi_calculator
description: "EMI Calculator — calculate Equated Monthly Instalments for home, car and personal loans, with amortization schedule and interest-vs-principal chart."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# NOTE: SOW §9 pins older package versions (≈2024 era). They do not resolve on the
# installed toolchain (Flutter 3.44.8 / Dart 3.12.2), which requires analyzer 8.x and
# therefore newer riverpod / custom_lint / freezed. Versions below are the minimum
# coherent set that resolves on this SDK. Deviations flagged to the client for sign-off.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (SOW §9 pins ^2.5.1; toolchain forces 3.x — same @riverpod codegen API)
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation (SOW §9 pins ^14.2.0)
  go_router: ^18.0.1

  # UI / Fonts (SOW §9 pins google_fonts ^6.2.1, fl_chart ^0.68.0)
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0

  # Ads (SOW §9 pins ^5.1.0; toolchain forces 9.x — AGP 9 / Gradle 9 compat)
  google_mobile_ads: ^9.1.0

  # Utilities (SOW §9 pins intl ^0.19.0, share_plus ^9.0.0, shared_preferences ^2.3.0)
  intl: ^0.20.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5

  # Data / Serialisation (SOW §9 pins freezed_annotation ^2.4.4, json_annotation ^4.9.0)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.3.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
